plugins {
    id 'com.android.application'
}

android {
    namespace 'com.max.goldai'
    compileSdk 35

    defaultConfig {
        applicationId "com.max.goldai"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}